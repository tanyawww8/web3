<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивная страница (Задание 3)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <!-- Шапка сайта -->
        <header class="header">
            <div class="logo">Лого</div>
            <div class="site-name">Название сайта</div>
        </header>

        <!-- Навигация -->
        <nav class="nav">
            <ul>
                <li><a href="#">Ссылка меню 1</a></li>
                <li><a href="#">Ссылка 2</a></li>
                <li><a href="#">Ссылка 3</a></li>
            </ul>
        </nav>

        <!-- Основной контент -->
        <main class="content">
            <!-- По заданию п.3: в HTML список ссылок идет ПЕРЕД таблицей -->
            <section class="links-section">
                <h2>Список гиперссылок</h2>
                <ul>
                    <li><a href="#">Гиперссылка 1</a></li>
                    <li><a href="#">Гиперссылка 2</a></li>
                    <li><a href="#">Гиперссылка 3</a></li>
                </ul>
            </section>

            <section class="table-section">
                <h2>Таблица</h2>
                <table>
                    <tr>
                        <th>Заголовок 1</th>
                        <th>Заголовок 2</th>
                    </tr>
                    <tr>
                        <td>Ячейка 1</td>
                        <td>Ячейка 2</td>
                    </tr>
                    <tr>
                        <td>Ячейка 3</td>
                        <td>Ячейка 4</td>
                    </tr>
                </table>
            </section>

            <section class="form-section">
                <h2>Форма</h2>
                <form action="#" method="post">
                    <label for="name">Имя:</label>
                    <input type="text" id="name" name="name">
                    <button type="submit">Отправить</button>
                </form>
            </section>
        </main>

        <!-- Подвал -->
        <footer class="footer">
            <p>(c) Сергей Синица</p>
        </footer>
    </div>
</body>
</html>
